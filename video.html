<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto-Connect P2P Video</title>
    <!-- Load PeerJS Library from CDN -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #202124; color: white; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        h1 { margin-bottom: 10px; }
        
        .video-container {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        video {
            width: 320px;
            height: 240px;
            background: #000;
            border-radius: 8px;
            border: 2px solid #5f6368;
            object-fit: cover;
        }

        .controls {
            background: #303134;
            padding: 20px;
            border-radius: 8px;
            width: 100%;
            max-width: 600px;
            box-sizing: border-box;
            text-align: center;
        }

        .room-box {
            background: #121212;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            border: 1px solid #5f6368;
        }

        .room-id {
            font-family: monospace;
            font-size: 1.2em;
            color: #8ab4f8;
            word-break: break-all;
            margin: 10px 0;
            display: block;
        }

        button {
            background: #8ab4f8;
            color: #000;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            margin: 5px;
        }
        button:hover { background: #aecbfa; }
        button:disabled { background: #5f6368; cursor: not-allowed; }
        
        .status { margin-top: 10px; font-weight: bold; }
        .connected { color: #81c995; }
        .waiting { color: #fdd663; }
        .error { color: #f28b82; }
    </style>
</head>
<body>

    <h1>Auto-Connect Video Chat</h1>

    <div class="video-container">
        <div>
            <p>You</p>
            <video id="localVideo" autoplay muted playsinline></video>
        </div>
        <div>
            <p>Peer</p>
            <video id="remoteVideo" autoplay playsinline></video>
        </div>
    </div>

    <div class="controls">
        <div id="setupStep">
            <h3>1. Enable Camera</h3>
            <button id="btnStart" onclick="startCamera()">Start Camera</button>
            <div id="status" class="status"></div>
        </div>

        <div id="roomStep" style="display:none;">
            <h3>2. Share this Link</h3>
            <p>Send this link to your friend to connect automatically:</p>
            
            <div class="room-box">
                <span id="roomLink" class="room-id"></span>
                <button onclick="copyLink()">Copy Link</button>
            </div>

            <div id="connectionStatus" class="status waiting">Waiting for peer to join...</div>
        </div>
    </div>

    <script>
        let peer = null;
        let localStream = null;
        let currentCall = null;

        const localVideo = document.getElementById('localVideo');
        const remoteVideo = document.getElementById('remoteVideo');
        const statusDiv = document.getElementById('status');
        const roomStep = document.getElementById('roomStep');
        const roomLinkSpan = document.getElementById('roomLink');
        const connStatus = document.getElementById('connectionStatus');

        // 1. Start Camera & Initialize Peer
        async function startCamera() {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                localVideo.srcObject = localStream;
                
                statusDiv.innerHTML = '<span class="connected">✓ Camera Ready</span>';
                document.getElementById('btnStart').disabled = true;
                
                initPeer();
            } catch (err) {
                statusDiv.innerHTML = '<span class="error">✗ Camera Error: ' + err.message + '</span>';
            }
        }

        // 2. Initialize PeerJS Connection
        function initPeer() {
            // Create a random ID for this session
            // We also check URL params to see if we are joining someone else
            const urlParams = new URLSearchParams(window.location.search);
            const joinId = urlParams.get('join');

            // Initialize Peer
            peer = new Peer(null, {
                debug: 2
            });

            peer.on('open', (id) => {
                roomStep.style.display = 'block';
                
                if (joinId) {
                    // We are the JOINER (User B)
                    roomLinkSpan.textContent = `Joining room: ${joinId}`;
                    connStatus.textContent = "Connecting to host...";
                    connectToPeer(joinId);
                } else {
                    // We are the HOST (User A)
                    const shareUrl = `${window.location.origin}${window.location.pathname}?join=${id}`;
                    roomLinkSpan.textContent = shareUrl;
                    connStatus.textContent = "Waiting for peer to join...";
                }
            });

            peer.on('error', (err) => {
                connStatus.innerHTML = `<span class="error">✗ Connection Error: ${err.type}</span>`;
            });

            // Handle Incoming Call (Host receives call from Joiner)
            peer.on('call', (call) => {
                connStatus.textContent = "Peer connecting...";
                call.answer(localStream); // Answer with our stream
                handleCall(call);
            });
        }

        // 3. Connect to Peer (Joiner calls Host)
        function connectToPeer(peerId) {
            const call = peer.call(peerId, localStream);
            handleCall(call);
        }

        // 4. Handle Media Stream
        function handleCall(call) {
            currentCall = call;
            
            call.on('stream', (remoteStream) => {
                remoteVideo.srcObject = remoteStream;
                connStatus.innerHTML = '<span class="connected">✓ Connected!</span>';
            });

            call.on('close', () => {
                connStatus.innerHTML = '<span class="error">✗ Peer disconnected</span>';
                remoteVideo.srcObject = null;
            });
        }

        // 5. Copy Link Utility
        function copyLink() {
            const text = roomLinkSpan.textContent;
            navigator.clipboard.writeText(text).then(() => {
                alert("Link copied! Send it to your friend.");
            });
        }
    </script>
</body>
</html>
